<!-- ko if: isPromoEnabled && promoCheckoutMessageText -->
<div class="pp-promo-banner">
    <div class="pp-promo-banner__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="#fff"/>
            <rect x="3" y="9" width="18" height="2" fill="#0070e0"/>
            <rect x="6" y="14" width="5" height="1.6" rx="0.8" fill="#0070e0"/>
        </svg>
    </div>
    <div class="pp-promo-banner__text" data-bind="html: promoCheckoutMessageText"></div>
    <!-- ko if: promoRedirectUrl && promoLinkText -->
    <a class="pp-promo-banner__cta" target="_blank" rel="noopener noreferrer"
       data-bind="attr: {href: promoRedirectUrl}">
        <span data-bind="text: getPromoLinkLabel()"></span>
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M2.5 8h10.5M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <!-- /ko -->
</div>
<!-- /ko -->
